name: Release

# Push a tag like v1.2.3 to build every platform and publish a GitHub Release.
# The website's download buttons always point at the latest release, so no
# site rebuild is needed after releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build and publish, e.g. v0.3.0 (must already exist)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -race ./...

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Crossdesk-macOS-universal.zip
          if-no-files-found: error

  windows-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/build-cross.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux
          path: |
            dist/Crossdesk-Windows-*.exe
            dist/Crossdesk-Linux-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [macos, windows-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum Crossdesk-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --title "Crossdesk $VERSION" --generate-notes $prerelease --verify-tag
          fi
